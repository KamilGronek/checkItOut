<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Check It Out - Platforma Influencer Marketingu dla Lokalnych Firm</title>
    <meta

      content="Łączymy lokalne firmy z influencerami, umożliwiając skuteczne kampanie marketingowe oparte na zaufaniu, transparentności i realnych wynikach."
    />
    <meta
      name="keywords"
      content="influencer marketing, lokalne firmy, kampanie marketingowe, influencerzy, Check It Out, social media, współpraca, kampania, reklama, influencer, firmy lokalne, promocja"
    />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0"
    />

    <meta name="author" content="Check It Out" />
    <meta name="robots" content="index, follow" />

    <base href="/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Check It Out - Influencer Marketing dla Firm" />
    <meta
      property="og:description"
      content="Platforma łącząca lokalne firmy z influencerami. Współprace, które działają."

    <meta property="og:image" content="assets/logos/favicon/android-chrome-512x512.png" />
    <meta property="og:url" content="https://app.check-it-out.pl" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Check It Out - Influencer Marketing dla Firm" />

    <meta name="twitter:image" content="assets/logos/favicon/android-chrome-512x512.png" />

    <!-- Favicon & Manifest -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/logos/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/logos/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/logos/favicon/favicon-16x16.png" />
    <link rel="manifest" href="assets/logos/favicon/site.webmanifest" />
    <link rel="mask-icon" href="assets/logos/favicon/safari-pinned-tab.svg" color="#1e40af" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Fonts -->
    <link href="assets/fonts/inter/inter.css" rel="stylesheet" />
    <link href="https://fonts.gstatic.com" rel="preconnect" />

      rel="stylesheet"

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <!-- Styles -->
    <link href="assets/styles/splash-screen.css" rel="stylesheet" />

  <body>
    <!-- Splash screen -->
    <fuse-splash-screen>
      <img src="assets/logos/svg/logo_rounded.svg" alt="Check It Out logo" />

        <div class="bounce1"></div>
        <div class="bounce2"></div>
        <div class="bounce3"></div>

    <app-root></app-root>
