<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="200" fill="#fafafa" rx="10" ry="10" />
  
  <!-- LEFT SIDE: PERSON -->
  <g>
    <!-- Person energy field -->
    <circle cx="130" cy="100" r="45" fill="#bfdbfe" opacity="0.3" />
    
    <!-- Person figure perfectly centered in the circle -->
    <g transform="translate(130, 100)">
      <!-- Head and body properly sized to fit within the circle -->
      <circle cx="0" cy="-15" r="20" fill="#3b82f6" /> <!-- Head -->
      <rect x="-15" y="5" width="30" height="40" rx="10" fill="#3b82f6" /> <!-- Body -->
    </g>
  </g>
  
  <!-- RIGHT SIDE: BUSINESS -->
  <g>
    <!-- Business energy field/container -->
    <circle cx="270" cy="100" r="45" fill="#e2e8f0" opacity="0.3" />
    
    <!-- Building perfectly centered in the circle -->
    <g transform="translate(270, 100)">
      <rect x="-30" y="-30" width="60" height="60" fill="#64748b" rx="3" />
      
      <!-- Building details - proportionally adjusted to fit -->
      <rect x="-23" y="-23" width="16" height="12" fill="#f1f5f9" rx="1" /> <!-- Window -->
      <rect x="7" y="-23" width="16" height="12" fill="#f1f5f9" rx="1" /> <!-- Window -->
      <rect x="-23" y="-6" width="16" height="12" fill="#f1f5f9" rx="1" /> <!-- Window -->
      <rect x="7" y="-6" width="16" height="12" fill="#f1f5f9" rx="1" /> <!-- Window -->
      <rect x="-10" y="11" width="20" height="19" fill="#f1f5f9" /> <!-- Door -->
    </g>
  </g>
  
  <!-- CENTER: CONNECTION -->
  <g>
    <!-- Connection line -->
    <line x1="175" y1="100" x2="225" y2="100" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,3" />
    
    <!-- Person to business energy animation -->
    <circle r="5" fill="#3b82f6" opacity="0.8">
      <animateMotion path="M175,100 L225,100" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <!-- Business to person energy animation -->
    <circle r="5" fill="#64748b" opacity="0.8">
      <animateMotion path="M225,100 L175,100" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>