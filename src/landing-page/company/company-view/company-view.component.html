<div class="bg-white min-h-screen flex flex-col">
    <!-- Sekcja Hero -->
    <div class="bg-white py-12 px-4 text-center border-b border-gray-200">
        <h1 class="text-3xl md:text-5xl font-extrabold text-primary-600">
            {{ heroTitle }}
        </h1>
        <p class="mt-4 text-lg md:text-xl text-gray-700 max-w-3xl mx-auto">
            {{ heroSubtitle }}
        </p>
        <div class="mt-8">
            <button
                class="mdc-button mdc-button--unelevated bg-primary-600 text-white py-3 px-8 rounded-full font-semibold shadow hover:opacity-90 transition-all duration-200">
                Załóż konto
            </button>
        </div>
    </div>

    <!-- Sekcja z korzyściami -->
    <div class="container mx-auto px-4 py-12 flex-1 mt-16">
        <h2 class="text-2xl md:text-3xl font-bold text-center text-primary-600 mb-8">
            Poznaj możliwości naszej platformy
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div
                *ngFor="let benefit of benefits"
                class="p-6 border rounded-lg shadow-sm flex flex-col justify-center items-start"
            >
                <h3 class="text-xl font-semibold text-gray-800 mb-2">
                    {{ benefit.title }}
                </h3>
                <p class="text-gray-600 leading-relaxed">
                    {{ benefit.description }}
                </p>
            </div>
        </div>
    </div>

    <!-- CTA końcowe -->
    <div class="bg-white py-8 px-4 text-center border border-gray-200">
        <p class="text-xl font-semibold text-gray-800">
            {{ finalCTA }}
        </p>
        <button
            class="mt-4 mdc-button mdc-button--unelevated bg-primary-600 text-white py-3 px-8 rounded-full font-semibold shadow hover:opacity-90 transition-all duration-200">
            Dołącz teraz
        </button>
    </div>

    <app-collaborations [collaborations]="collaborations" [viewType]="viewType"></app-collaborations>
</div>
<app-footer/>
