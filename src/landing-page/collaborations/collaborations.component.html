<!-- Sekcja z przykładami  współprac -->
<div class="px-2 mt-6 sm:px-36 sm:mt-16">
    <h4 class="text-primary-600 text-center sm:text-left sm:text-3xl mb-2 sm:mb-6 font-bold">Tak wyglądają u nas
        współprace:</h4>
    <div class="px-2 sm:px-16">
        <app-carousel
            *ngIf="true"
            #companiesCarousel
            [items]="collaborations"
            [showCarousel]="true"
        >
            <ng-template #itemTemplate let-collab>
                <fuse-card
                    class="filter-info flex"
                    [flippable]="true"
                    #fuseCard
                >
                    <ng-container fuseCardFront>
                        <div
                            class="flex w-full max-w-80 flex-col items-center p-8 pb-6 min-w-60"
                        >
                            <div
                                class="glow-wrapper"
                            >
                                <img
                                    [src]="collab.avatarUrl"
                                    alt="Card cover image"
                                    class="h-32 w-32 rounded-full"
                                />
                            </div>

                            <div
                                class="mt-8 text-center text-2xl font-semibold"
                            >
                                {{ collab.name }}
                            </div>
                            <div
                                class="text-secondary mt-1 text-center leading-tight text-lg"
                            >
                                {{ collab.partnershipOpportunityTitle }}
                            </div>
                            <hr class="mb-0 mt-2 w-full border-t"/>
                            <div
                                class="text-secondary mt-4 text-center leading-tight text-lg"
                            >
                                {{ collab.title }}
                            </div>

                            <div
                                class="flex justify-end pointer-events-auto mt-4"
                            >
                                <button
                                    (click)="fuseCard.face = 'back'"
                                    class="bg-blue-500 hover:bg-blue-600 text-white text-md font-semibold py-2 px-4 rounded-lg transition duration-300"
                                >
                                    Read more
                                </button>
                            </div>
                            <div *ngIf="collab.question">
                                <p class="mt-4 text-lg text-center">
                                    {{ collab.question }}
                                </p>
                                <div
                                    class="flex justify-evenly items-center w-full pointer-events-auto mt-6"
                                >
                                    <app-button
                                        tooltip="Raised button" variant="raised" color="primary"
                                        (click)="fuseCard.face = 'back';"
                                    >
                                        Akceptuj
                                    </app-button>
                                    <app-button tooltip="Raised button" variant="raised" color="warn"
                                        (click)="fuseCard.face = 'back';"
                                    >
                                        Odrzuć
                                    </app-button>
                                </div>
                            </div>
                        </div>
                    </ng-container>
                    <ng-container fuseCardBack>
                        <div class="flex flex-col flex-auto px-8 py-6 pt-3">
                            <div class="mb-2 -mx-3">
                                <button
                                    mat-icon-button
                                    [color]="'primary'"
                                    (click)="
                                        fuseCard.face = 'front';
                                    "
                                >
                                    <mat-icon
                                        class="icon-size-5"
                                        [svgIcon]="
                                            'heroicons_outline:arrow-left'
                                        "
                                    ></mat-icon>
                                </button>
                            </div>

                            <div>
                                <app-collaboration-companies-stepper
                                    [currentStatus]="
                                        collab.appliedOpportunityStatus
                               "
                                ></app-collaboration-companies-stepper>
                            </div>
                        </div>
                    </ng-container>
                </fuse-card>
            </ng-template>
        </app-carousel>
    </div>
</div>
