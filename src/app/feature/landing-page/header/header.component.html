<header class="fixed top-0 left-0 w-full z-999 bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <!-- Logo -->
            <div class="flex-shrink-0">
                <a href="#" class="text-xl font-bold text-gray-800">Logo</a>
            </div>
            <!-- Desktop Menu -->
            <nav class="hidden md:flex space-x-8">
                <a *ngFor="let link of navLinks"
                   (click)="scrollTo(link.sectionId)"
                   class="cursor-pointer text-gray-700 hover:text-blue-500 transition-colors">
                    {{ link.name }}
                </a>
            </nav>
            <app-link routerLink="/auth/sign-in" variant="button" color="accent" class="mr-2">Zaloguj</app-link>
            <app-link routerLink="/auth/sign-up" variant="button" color="primary">Zarejestruj</app-link>
            <!-- Mobile Menu Button -->
            <div class="md:hidden">
                <button (click)="toggleMenu()"
                        type="button"
                        class="text-gray-700 hover:text-blue-500 focus:outline-none focus:text-blue-500">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor"
                         viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="isMenuOpen" class="md:hidden">
        <nav class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
            <a *ngFor="let link of navLinks"
               (click)="scrollTo(link.sectionId)"
               class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-blue-500 hover:bg-gray-100 transition-colors cursor-pointer">
                {{ link.name }}
            </a>
        </nav>
    </div>
</header>
