<div class="bg-white shadow-md rounded-lg p-6">
    <!-- Create New Entry Form -->
    <div class="bg-gray-50 p-4 rounded-lg mb-6">
        <h2 class="text-xl font-semibold mb-4">Create New Dictionary Entry</h2>
        <form [formGroup]="createEntryForm" (ngSubmit)="onSubmitNewEntry()" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <app-input
                    placeholder="Key"
                    [control]="createEntryForm.controls.key">
                    Key
                </app-input>

                <app-input
                    placeholder="Value"
                    [control]="createEntryForm.controls.value">
                    Value
                </app-input>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <app-input
                    placeholder="Language Code"
                    [control]="createEntryForm.controls.languageCode">
                    Language Code
                </app-input>

                <app-input
                    placeholder="Category"
                    [control]="createEntryForm.controls.category">
                    Category
                </app-input>
<!--                @DEPRECATED-->
<!--                <mat-form-field class="w-full">-->
<!--                    <mat-label>Category</mat-label>-->
<!--                    <mat-select formControlName="category" class="w-full">-->
<!--                        <mat-option *ngFor="let category of categories()" [value]="category">-->
<!--                            {{category}}-->
<!--                        </mat-option>-->
<!--                    </mat-select>-->
<!--                    <mat-error *ngIf="createEntryForm.get('category')?.invalid"-->
<!--                               class="text-red-500 text-sm mt-1">-->
<!--                        Category is required-->
<!--                    </mat-error>-->
<!--                </mat-form-field>-->
            </div>
            <app-button
                [type]="'submit'"
                [disabled]="createEntryForm.invalid">
                Create Entry
            </app-button>
        </form>
    </div>

    <!-- Category Filter -->
    <div class="mb-4">
        <app-select
            label="Filter Category"
            [options]="categories()"
            [control]="selectedCategory"
            (selectionChange)="filterEntries()"/>
    </div>

    <!-- Entries Table -->
    <div class="overflow-x-auto">
        <table mat-table matSort [dataSource]="filteredEntries()" class="w-full">
            <!-- Key Column -->
            <ng-container matColumnDef="key">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="bg-gray-100 p-2 text-left">Key</th>
                <td mat-cell *matCellDef="let entry" class="p-2 border-b">{{entry.key}}</td>
            </ng-container>

            <!-- Value Column -->
            <ng-container matColumnDef="value">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="bg-gray-100 p-2 text-left">Value</th>
                <td mat-cell *matCellDef="let entry" class="p-2 border-b">{{entry.value}}</td>
            </ng-container>

            <!-- Language Column -->
            <ng-container matColumnDef="languageCode">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="bg-gray-100 p-2 text-left">Language</th>
                <td mat-cell *matCellDef="let entry" class="p-2 border-b">{{entry.languageCode}}</td>
            </ng-container>

            <!-- Category Column -->
            <ng-container matColumnDef="category">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="bg-gray-100 p-2 text-left">Category</th>
                <td mat-cell *matCellDef="let entry" class="p-2 border-b">{{entry.category}}</td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="bg-gray-100 p-2 text-left">Actions</th>
                <td mat-cell *matCellDef="let entry" class="p-2 border-b">
                    <app-button
                        variant="icon"
                        icon="feather:trash-2"
                        (click)="onDeleteEntry(entry.id)"
                    />
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-50"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"
                class="hover:bg-gray-50 transition-colors duration-200"></tr>
        </table>
    </div>
</div>
