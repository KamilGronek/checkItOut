<div class="flex items-center justify-end h-full">
    <div class="max-w-80">
        <!-- Logo -->
        <div class="w-12">
            <img src="assets/images/logo/logo.svg"/>
        </div>

        <!-- Title -->
        <div
            class="mt-8 text-4xl font-extrabold tracking-tight leading-tight"
        >Sign in</div>
        <div class="flex gap-1 items-baseline mt-0.5 font-medium">
            <span>Don't have an account? </span>
            <app-link [routerLink]="['/auth/sign-up']">Sign up</app-link>
        </div>
      
        <!-- Alert -->
        <fuse-alert
            class="mt-8"
            *ngIf="showAlert"
            [appearance]="'outline'"
            [showIcon]="false"
            [type]="alert.type"
            [@shake]="alert.type === 'error'"
        >
            {{ alert.message }}
        </fuse-alert>

        <!-- Sign in form -->
        <form class="mt-8" [formGroup]="signInForm" #signInNgForm="ngForm">
            <app-input
                type="email"
                id="email"
                placeholder="Email address"
                [control]="signInForm.controls['email']"
            >Email</app-input>

            <div class="mt-3">
                <app-input
                    type="password"
                    id="password"
                    placeholder="Password"
                    [control]="signInForm.controls['password']"
                >Password</app-input>
            </div>

            <!-- Actions -->
            <div class="grow inline-flex items-center justify-between w-full mt-3">
                <app-input
                    type="checkbox"
                    id="checkbox"
                    [control]="signInForm.controls['rememberMe']"
                >Remember me</app-input>
                <app-link
                    customClass="text-md"
                    [routerLink]="['/auth/forgot-password']"
                >Forgot password?
                </app-link>
            </div>

            <app-button
                color="primary"
                variant="flat"
                [loading]="signInForm.disabled"
                (click)="signInWithEmailAndPassword()"
                [icon]="'feather:log-in'">
                Sign in
            </app-button>
        </form>
        <!-- Separator -->
        <div class="flex items-center my-6">
            <div class="flex-auto mt-px border-t"></div>
            <div class="mx-2 text-secondary">Or continue with</div>
            <div class="flex-auto mt-px border-t"></div>
        </div>

        <!-- Single sign-on buttons -->
        <app-button
            variant="flat"
            color="accent"
            (click)="signInWithInstagram()"
            [icon]="'feather:instagram'">
            <span class="">Instagram</span>
        </app-button>
    </div>
</div>
