<div class="flex items-center justify-end h-full">
    <div class="max-w-80">
        <!-- Logo -->
        <div class="w-12">
            <img src="assets/images/logo/logo.svg">
        </div>

        <!-- Title -->
        <div class="mt-8 text-4xl font-extrabold tracking-tight leading-tight">Sign up</div>
        <div class="flex items-baseline mt-0.5 font-medium">
            <div>Already have an account?</div>
            <a
                class="ml-1 text-primary-500 hover:underline"
                [routerLink]="['/auth/sign-in']">Sign in
            </a>
        </div>

        <div class="flex flex-col gap-4 mt-8">
            <app-card (click)="signUpAsInfluencer()" customClass="hover:-translate-y-1 duration-300">
                <p card-header class="flex items-center gap-4">
                    <mat-icon color="accent" svgIcon="feather:instagram" class="icon-size-7"></mat-icon>
                    <span>
                        Influencer
                    </span>
                </p>
                <p class="mt-2">
                    Sign up using <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#f9ba34] via-[#ee2a7b] to-[#6228d7]">Instagram</span>
                </p>
            </app-card>
            <div class="flex items-center">
                <div class="flex-auto mt-px border-t"></div>
                <div class="mx-2 text-secondary">or Sign up as</div>
                <div class="flex-auto mt-px border-t"></div>
            </div>
            <app-card (click)="signUpAsBusiness()" customClass="hover:-translate-y-1 duration-300">
                <p card-header class="flex items-center gap-4">
                    <mat-icon color="accent" svgIcon="feather:clipboard" class="icon-size-7"></mat-icon>
                    <span>
                        Business
                    </span>
                </p>
                <p class="mt-2">
                    Sign up using Form
                </p>
                <p card-footer class="mt-3">
                    You'll be able to connect your <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#f9ba34] via-[#ee2a7b] to-[#6228d7]">Instagram</span> account after registration.
                </p>
            </app-card>
        </div>

        <!-- Alert -->
        <fuse-alert
            class="mt-8"
            *ngIf="showAlert"
            [appearance]="'outline'"
            [showIcon]="false"
            [type]="alert.type"
            [@shake]="alert.type === 'error'">
            {{ alert.message }}
        </fuse-alert>
    </div>
</div>
