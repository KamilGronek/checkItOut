<div class="flex items-center justify-center lg:justify-end h-full w-full">
    <div class="max-w-80">
        <!-- Logo -->
        <div class="w-12">
            <img src="assets/images/logo/logo.svg">
        </div>

        <!-- Title -->
        <div class="mt-8 text-4xl font-extrabold tracking-tight leading-tight">{{ 'auth.confirmation_required.title' | transloco }}</div>
        <div class="mt-4">
            {{ 'auth.confirmation_required.message' | transloco }}
        </div>

        <!-- Form footer -->
        <div class="mt-8 text-md font-medium text-secondary">
            <span>{{ 'auth.confirmation_required.return_to' | transloco }}</span>
            <a
                class="ml-1 text-primary-500 hover:underline"
                [routerLink]="['/auth/sign-in']">{{ 'auth.confirmation_required.sign_in_link' | transloco }}
            </a>
        </div>
    </div>
</div>
