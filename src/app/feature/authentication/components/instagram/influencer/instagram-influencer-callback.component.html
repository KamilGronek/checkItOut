<div class="flex items-center justify-end h-full w-full" *ngIf="emailRequired()">
    <div class="max-w-80">
        <!-- Logo -->
        <div class="w-12">
            <img src="../../../../../../assets/images/logo/logo.svg"/>
        </div>

        <!-- Title -->
        <div
            class="mt-8 text-4xl font-extrabold tracking-tight leading-tight"
        >
            Finish your registration
        </div>
        <div class="mt-0.5 font-medium">
            Fill the form with your credentials. Additionally to <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#f9ba34] via-[#ee2a7b] to-[#6228d7]">Instagram</span> log in method, you'll be able to log in with <span class="font-bold">email</span> and <span class="font-bold">password</span>.
        </div>

        <form
            [formGroup]="credentialsForm"
            (ngSubmit)="handleEmailAndPasswordSubmission()"
            class="mt-8 flex flex-col gap-3"
        >
            <app-input
                type="email"
                id="email"
                placeholder="Enter your email"
                [control]="credentialsForm.controls.email"

            >Email</app-input>

            <app-input
                type="password"
                [control]="credentialsForm.controls.password"
                placeholder="Create a strong password"
                hint="Use at least 8 characters with uppercase, lowercase, numbers and symbols"
            >Password</app-input>
            <div>
                <app-input
                    type="password"
                    [control]="credentialsForm.controls.confirmPassword"
                    placeholder="Confirm your password"
                >Confirm Password</app-input>

                <div *ngIf="credentialsForm.hasError('passwordMismatch')" class="text-red-500 text-sm">
                    Passwords do not match
                </div>
            </div>

            <app-input type="checkbox" [control]="credentialsForm.controls.termsOfService">
                <span class="flex gap-1">
                    Agree to the <app-link routerLink="/tos">Terms and Conditions</app-link>
                </span>
            </app-input>

            <app-button
                customClass="mt-2"
                variant="flat"
                color="primary"
                icon="feather:edit"
                (click)="handleEmailAndPasswordSubmission()"
                [disabled]="credentialsForm.disabled || credentialsForm.invalid"
                [loading]="credentialsForm.disabled">
                Register
            </app-button>

            <!-- Form footer -->
            <div class="mt-8 text-md font-medium text-secondary flex gap-1">
                <span>Return to </span>
                <app-link
                    [routerLink]="['/auth/sign-in']"
                >Sign in
                </app-link>
            </div>
        </form>
    </div>
</div>
<div
    class="w-full h-full flex items-center justify-center"
    *ngIf="!emailRequired()"
>
    <mat-spinner></mat-spinner>
</div>
