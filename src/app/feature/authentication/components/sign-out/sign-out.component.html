<div class="h-full flex flex-col flex-auto items-center justify-center min-w-0">
    <div class="w-full sm:w-auto py-8 px-4 sm:p-12 sm:rounded-2xl sm:shadow sm:bg-card">
        <div class="w-full max-w-80 sm:w-80 mx-auto sm:mx-0">
            <!-- Logo -->
            <div class="w-12 mx-auto">
                <img src="assets/images/logo/logo.svg">
            </div>

            <!-- Title -->
            <div class="mt-8 text-4xl font-extrabold tracking-tight leading-tight text-center">
                {{ 'auth.sign_out.title' | transloco }}
            </div>
            <div class="flex justify-center mt-0.5 font-medium">
                <!-- Redirect countdown -->
                <ng-container *ngIf="countdown > 0">
                    {{ 'auth.sign_out.redirecting' | transloco: { count: countdown } }}
                </ng-container>

                <!-- Redirect message -->
                <ng-container *ngIf="countdown === 0">
                    {{ 'auth.sign_out.being_redirected' | transloco }}
                </ng-container>
            </div>

            <!-- Form footer -->
            <div class="mt-8 text-md font-medium text-secondary text-center">
                <span>{{ 'auth.sign_out.go_to' | transloco }}</span>
                <a
                    class="ml-1 text-primary-500 hover:underline"
                    [routerLink]="['/auth/sign-in']">{{ 'auth.sign_out.sign_in_link' | transloco }}
                </a>
            </div>
        </div>
    </div>
</div>
