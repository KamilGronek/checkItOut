<div
    class="bg-card flex min-w-0 flex-auto flex-col dark:bg-transparent sm:inset-0 sm:overflow-hidden"
>
    <div
        class="flex flex-0 flex-col border-b px-6 py-8 sm:flex-row sm:items-center md:px-8 justify-between"
    >
        <div class="lg:text-4xl font-extrabold tracking-tight sm:text-3xl">
            {{ "user.collaborations.all.title" | transloco }}
        </div>
        <app-link routerLink="/collaborations/create">{{ "user.collaborations.all.add_collaboration" | transloco }}</app-link>

    </div>
    <div class="p-4 w-full grid grid-cols-[repeat(auto-fill,_minmax(300px,_1fr))] gap-4">
        <app-card
            *ngFor="let item of collaborationList"
            [flippable]="false"
            customClass="h-full"
            [imgSrc]="item.company.imageUrl"
            imgAlt="Collaboration card image">
            <!-- Header -->
            <div card-header>
                <div class="text-2xl font-semibold leading-tight">
                    {{ item.name }}
                </div>
                <a class="whitespace-nowrap text-primary-500">
                    {{ item.city }}
                </a>
            </div>

            <!-- Main Content -->
            <div class="space-y-2">
                <p>
                    {{ item.title }}
                </p>
                <p>
                    {{ item.details }}
                </p>
            </div>

            <!-- Footer -->
            <div card-footer>
                <app-link
                    [routerLink]="'/collaborations/' + item.id">
                    {{
                        "user.collaborations.all.collaboration_card.details_button"
                            | transloco
                    }}
                </app-link>
            </div>
        </app-card>
    </div>
    <div class="flex mb-10 items-center text-sm">
        <mat-paginator
            class="demo-paginator"
            (page)="handlePageEvent($event)"
            [length]="length"
            [pageSize]="pageSize"
            [disabled]="disabled"
            [showFirstLastButtons]="showFirstLastButtons"
            [pageSizeOptions]="showPageSizeOptions ? pageSizeOptions : []"
            [hidePageSize]="hidePageSize"
            [pageIndex]="pageIndex"
            [attr.aria-label]="
                'user.collaborations.all.pagination.select_page' | transloco
            "
        >
        </mat-paginator>
        <label
        >{{
                "user.collaborations.all.pagination.page_number" | transloco
            }}{{ pageIndex }}</label
        >
    </div>
</div>
