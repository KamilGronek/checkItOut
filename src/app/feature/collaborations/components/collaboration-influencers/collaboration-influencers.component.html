<div
    class="bg-card flex min-w-0 flex-auto flex-col dark:bg-transparent sm:inset-0 sm:overflow-hidden"
>
    <div
        class="flex flex-0 flex-col border-b px-6 py-8 sm:flex-row sm:items-center md:px-8"
    >
        <div class="text-4xl font-extrabold tracking-tight">
            Aktywne współprace
        </div>
    </div>

    <!-- Tab Navigation -->
    <mat-tab-group class="light pt-4">


        <!-- Companies Tab -->
        <mat-tab label="Współprace w toku" class="light">
            <div class="p-4 light">
                <app-collaboration-companies [viewType]="ViewType.COMPANY"></app-collaboration-companies>
            </div>
        </mat-tab>

        <!-- Influencers Tab -->
        <mat-tab label="Zgłoszenia" class="light">
            <div class="p-4 light">
                <app-collaboration-registrations></app-collaboration-registrations>
            </div>
        </mat-tab>

        <mat-tab label="Oceny współprac" class="light">
            <div class="p-4 light">
                <app-collaboration-ratings></app-collaboration-ratings>
            </div>
        </mat-tab>
    </mat-tab-group>
</div>
