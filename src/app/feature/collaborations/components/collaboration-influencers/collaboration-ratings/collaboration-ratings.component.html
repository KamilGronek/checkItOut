<div class="border-b px-6 py-8 sm:flex-row sm:items-center md:px-8">
    <div class="flex w-full justify-between items-center">
        <div class="text-2xl font-extrabold tracking-tight p-8">
            Oceny podjętych współprac
        </div>
    </div>

    <!-- Jeśli są influencerzy -->
    <div *ngIf="collaborations.length > 0; else noCollaborations">
        <app-carousel
            #rateCarousel
            [items]="collaborations"
            [showCarousel]="showCarousel"
            [responsiveOptions]="responsiveOptions"
        >
            <ng-template #itemTemplate let-collab>
                <fuse-card
                    class="filter-info flex"
                    [flippable]="true"
                    #fuseCard
                >
                    <!-- FRONT -->
                    <ng-container fuseCardFront>
                        <div
                            class="flex w-full max-w-40 flex-col items-center p-8 pb-6 min-w-30"
                        >
                            <div>
                                <img
                                    [src]="collab.influencerAvatarUrl"
                                    alt="Card cover image"
                                    class="h-20 w-20 rounded-full"
                                />
                            </div>
                            <div
                                class="mt-4 text-center text-2xl font-semibold"
                            >
                                {{ collab.influencerFirstName }}
                                {{ collab.influencerLastName }}
                            </div>
                            <div
                                class="text-secondary mt-1 text-center leading-tight"
                            >
                                {{ collab.partnershipOpportunityTitle }}
                            </div>

                            <hr class="mt-4 w-full border-t mb-4" />
                            <div
                                class="flex justify-between items-center text-3xl w-full pointer-events-auto"
                            >
                                <button
                                    [disabled]="
                                        collab.rateStatus === 'POSITIVE'
                                    "
                                    [ngClass]="{
                                        'transform transition-transform duration-300 hover:scale-125':
                                            collab.rateStatus !== 'POSITIVE',
                                        'cursor-not-allowed opacity-50':
                                            collab.rateStatus === 'POSITIVE'
                                    }"
                                    (click)="
                                        fuseCard.face = 'back';
                                        setRateStatus(
                                            'POSITIVE',
                                            collab.appliedOpportunityId
                                        )
                                    "
                                >
                                    👍
                                </button>

                                <button
                                    [disabled]="
                                        collab.rateStatus === 'NEGATIVE'
                                    "
                                    [ngClass]="{
                                        'transform transition-transform duration-300 hover:scale-125':
                                            collab.rateStatus !== 'NEGATIVE',
                                        'cursor-not-allowed opacity-50':
                                            collab.rateStatus === 'NEGATIVE'
                                    }"
                                    (click)="
                                        fuseCard.face = 'back';
                                        setRateStatus(
                                            'NEGATIVE',
                                            collab.appliedOpportunityId
                                        )
                                    "
                                >
                                    👎
                                </button>
                            </div>
                        </div>
                    </ng-container>

                    <!-- BACK -->
                    <ng-container fuseCardBack>
                        <div class="flex flex-col flex-auto px-8 py-6 pt-3">
                            <div class="mb-2 -mx-3">
                                <button
                                    mat-icon-button
                                    [color]="'primary'"
                                    (click)="fuseCard.face = 'front'"
                                >
                                    <mat-icon
                                        class="icon-size-5"
                                        [svgIcon]="
                                            'heroicons_outline:arrow-left'
                                        "
                                    ></mat-icon>
                                </button>
                            </div>
                        </div>
                        <div class="mt-auto text-center">
                            <p class="text-xl mb-4">
                                Czy na pewno chcesz dodać opinię?
                            </p>
                            <div class="flex justify-around items-center mb-4">
                                <button
                                    class="bg-green-400 rounded-lg text-white px-4 py-2"
                                    (click)="confirmRateStatus()"
                                >
                                    TAK
                                </button>
                                <button
                                    class="bg-red-400 rounded-lg text-white px-4 py-2"
                                    (click)="
                                        fuseCard.face = 'front';
                                        resetRateStatus(fuseCard)
                                    "
                                >
                                    NIE
                                </button>
                            </div>
                        </div>
                    </ng-container>
                </fuse-card>
            </ng-template>
        </app-carousel>
    </div>

    <!-- Jeśli brak influencerów -->
    <ng-template #noCollaborations>
        <p>Nie znaleziono żadnych współprac oczekujących na ocenę.</p>
    </ng-template>
</div>
