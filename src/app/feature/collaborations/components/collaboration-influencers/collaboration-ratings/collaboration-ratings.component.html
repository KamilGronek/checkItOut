<div class="px-6 py-4 sm:flex-row sm:items-center light md:px-8">
    <!-- Search Form on the left side -->
    <div class="flex w-full items-center mb-4 pb-5">
        <mat-form-field
            class="w-full sm:mt-0 sm:w-72"
            [subscriptSizing]="'dynamic'"
        >
            <mat-icon
                matPrefix
                class="icon-size-5"
                [svgIcon]="'heroicons_solid:magnifying-glass'"
            ></mat-icon>
            <input
                matInput
                placeholder="Wyszukaj"
                #searchInput
                [(ngModel)]="searchText"
                name="searchText"
                (input)="filterOpportunities()"
            />
        </mat-form-field>

        <!-- Spacer -->
        <div class="flex-grow"></div>
    </div>

    <!-- Jeśli są influencerzy -->
    <div *ngIf="collaborations.length > 0; else noCollaborations">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-4">
            <div *ngFor="let collab of displayedCollaborations"
                 style="height: 466px">
                <fuse-card
                    class="filter-info flex"
                    [flippable]="true"
                    #fuseCard
                    style="width: 300px;
                    height: 300px;"
                >
                    <!-- FRONT -->
                    <ng-container fuseCardFront>
                        <div
                            class="flex w-full flex-col items-center min-w-30"
                        >
                            <div class="mt-6">
                                <img
                                    [src]="collab.influencerAvatarUrl"
                                    alt="Card cover image"
                                    class="h-20 w-20 rounded-full"
                                />
                            </div>
                            <div
                                class="mt-4 text-center text-2xl font-semibold"
                            >
                                {{ collab.influencerFirstName }}
                            </div>
                            <div
                                class="text-center text-2xl font-semibold"
                            >
                                {{ collab.influencerLastName }}
                            </div>

                            <div class=" text-center self-center justify-self-center leading-tight text-lg w-3/4 mt-3">
                                    Czy wszystko bylo w porządku?
                            </div>

                            <div class="flex w-full items-center divide-x border-t">
                                <a
                                    class="flex flex-auto items-center justify-center py-3 ratingNo"
                                    [ngClass]="{'selected-no': collab.selectedRating === 'NEGATIVE'}"
                                    (click)="setRateStatusAndFlip('NEGATIVE', collab.id, fuseCard); $event.preventDefault()"
                                >
                                    <mat-icon
                                        class="text-red-700 icon-size-5"
                                        [svgIcon]="'heroicons_outline:hand-thumb-down'"
                                    ></mat-icon>
                                    <span class="ml-2">Nie</span>
                                </a>
                                <a
                                    class="flex flex-auto items-center justify-center py-3 ratingYes"
                                    [ngClass]="{'selected-yes': collab.selectedRating === 'POSITIVE'}"
                                    (click)="setRateStatusAndFlip('POSITIVE', collab.id, fuseCard); $event.preventDefault()"
                                >
                                    <mat-icon
                                        class="text-green-700 icon-size-5"
                                        [svgIcon]="'heroicons_outline:hand-thumb-up'"
                                    ></mat-icon>
                                    <span class="ml-2">Tak</span>
                                </a>
                            </div>
                        </div>
                    </ng-container>

                    <!-- BACK -->
                    <ng-container fuseCardBack>
                        <div class="flex items-center mb-2 px-6 pt-4">
                            <button
                                mat-icon-button
                                class="back-button"
                                (click)="fuseCard.face = 'front'">
                                <mat-icon class="icon-size-5" [svgIcon]="'heroicons_outline:arrow-left'"></mat-icon>
                            </button>
                            <h2 class="status-title text-lg font-medium">
                                Potwierdź wybór
                            </h2>
                        </div>
                        <div class="mb-6 px-6 flex justify-center mt-8 flex items-center">
                            <mat-icon
                                class="text-center opacity-30 icon-size-16"
                                [svgIcon]="selectedRate?.rateStatus === 'POSITIVE' ? 'heroicons_outline:face-smile' : 'heroicons_outline:face-frown'"
                                [ngClass]="selectedRate?.rateStatus === 'POSITIVE' ? 'text-green-500' : 'text-red-500'">
                            </mat-icon>
                        </div>
                        <div class="mt-auto text-center">
                            <p class="text-lg mb-4">
                                Czy na pewno chcesz {{ selectedRate?.rateStatus === 'POSITIVE' ? 'pozytywnie' : 'negatywnie' }} ocenić współpracę?
                            </p>
                            <div class="flex w-full items-center divide-x border-t">
                                <button
                                    class="flex flex-auto items-center justify-center py-3 bg-pastel-red hover-darken"
                                    (click)="fuseCard.face = 'front';"
                                >
                                    <mat-icon
                                        class="text-red-700 icon-size-5"
                                        [svgIcon]="'heroicons_solid:x-mark'"
                                    ></mat-icon>
                                    <span class="ml-2">Nie</span>
                                </button>
                                <button
                                    class="flex flex-auto items-center justify-center py-3 bg-pastel-green hover-darken"
                                    (click)="confirmRateStatus(); fuseCard.face = 'front';"
                                >
                                    <mat-icon
                                        class="text-green-700 icon-size-5"
                                        [svgIcon]="'heroicons_solid:check'"
                                    ></mat-icon>
                                    <span class="ml-2">Tak</span>
                                </button>
                            </div>
                        </div>
                    </ng-container>
                </fuse-card>
            </div>
        </div>

        <!-- Paginator - positioned under cards and aligned to the left -->
        <div class="flex items-center justify-start mt-6 mb-10">
            <mat-paginator
                class="demo-paginator"
                (page)="handlePageEvent($event)"
                [length]="filteredCollaborations.length"
                [pageSize]="pageSize"
                [disabled]="false"
                [showFirstLastButtons]="true"
                [pageSizeOptions]="[4, 8, 12]"
                [hidePageSize]="false"
                [pageIndex]="pageIndex"
                aria-label="Wybierz stronę"
            >
            </mat-paginator>
            <label class="h-full flex items-center text-sm ml-2">
                Strona {{ pageIndex + 1 }}
            </label>
        </div>
    </div>

    <!-- Jeśli brak influencerów -->
    <ng-template #noCollaborations>
        <p>Nie znaleziono żadnych współprac oczekujących na ocenę.</p>
    </ng-template>
</div>
