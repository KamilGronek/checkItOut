<header [ngClass]="{'scrolled': isScrolled}">
    <div class="container">
        <nav>
            <!-- Logo - Stays visible on all screen sizes -->
            <a routerLink="/" class="logo">
                Check It Out
            </a>

            <!-- Desktop Navigation Links -->
            <div class="nav-links" [ngClass]="{'active': isMenuOpen}">
                <a routerLink="/" fragment="how-it-works" (click)="closeMenu()" *ngIf="currentLang === 'pl'">Jak to działa</a>
                <a routerLink="/" fragment="how-it-works" (click)="closeMenu()" *ngIf="currentLang === 'en'">How it works</a>

                <a routerLink="/" fragment="testimonials" (click)="closeMenu()" *ngIf="currentLang === 'pl'">Opinie</a>
                <a routerLink="/" fragment="testimonials" (click)="closeMenu()" *ngIf="currentLang === 'en'">Testimonials</a>

                <a routerLink="/" fragment="faq" (click)="closeMenu()" *ngIf="currentLang === 'pl'">FAQ</a>
                <a routerLink="/" fragment="faq" (click)="closeMenu()" *ngIf="currentLang === 'en'">FAQ</a>

                <a routerLink="/team" (click)="closeMenu()" *ngIf="currentLang === 'pl'">Zespół</a>
                <a routerLink="/team" (click)="closeMenu()" *ngIf="currentLang === 'en'">Team</a>

                <a routerLink="/" fragment="contact" (click)="closeMenu()" *ngIf="currentLang === 'pl'">Kontakt</a>
                <a routerLink="/" fragment="contact" (click)="closeMenu()" *ngIf="currentLang === 'en'">Contact</a>

                <!-- Mobile-only buttons -->
                <div class="mobile-buttons">
                    <a routerLink="/auth/sign-in" class="btn btn-outline-primary" *ngIf="currentLang === 'pl'">Zaloguj się</a>
                    <a routerLink="/auth/sign-in" class="btn btn-outline-primary" *ngIf="currentLang === 'en'">Log in</a>
                    <a routerLink="/auth/sign-up" class="btn btn-primary" *ngIf="currentLang === 'pl'">Zarejestruj się</a>
                    <a routerLink="/auth/sign-up" class="btn btn-primary" *ngIf="currentLang === 'en'">Sign up</a>
                </div>
            </div>

            <!-- Desktop-only buttons -->
            <div class="desktop-buttons">
                <a routerLink="/auth/sign-in" class="btn btn-outline-primary mr-1" *ngIf="currentLang === 'pl'">Zaloguj się</a>
                <a routerLink="/auth/sign-in" class="btn btn-outline-primary mr-1" *ngIf="currentLang === 'en'">Log in</a>
                <a routerLink="/auth/sign-up" class="btn btn-primary" *ngIf="currentLang === 'pl'">Zarejestruj się</a>
                <a routerLink="/auth/sign-up" class="btn btn-primary" *ngIf="currentLang === 'en'">Sign up</a>
            </div>

            <!-- Language Switcher -->
            <div class="lang-switcher">
                <button class="lang-switcher-btn" (click)="toggleLangDropdown($event)">
                    <img *ngIf="currentLang === 'pl'" src="assets/images/flags/PL2.png" alt="Polish flag" class="flag-icon">
                    <img *ngIf="currentLang === 'en'" src="assets/images/flags/UK.png" alt="English flag" class="flag-icon">
                    <span>{{ currentLang.toUpperCase() }}</span>
                </button>
                <div class="lang-dropdown" [ngClass]="{'active': isLangDropdownOpen}">
                    <div class="lang-option" [ngClass]="{'active': currentLang === 'pl'}" (click)="switchLanguage('pl')">
                        <img src="assets/images/flags/PL2.png" alt="Polish flag" class="flag-icon">
                        <span>Polski</span>
                    </div>
                    <div class="lang-option" [ngClass]="{'active': currentLang === 'en'}" (click)="switchLanguage('en')">
                        <img src="assets/images/flags/UK.png" alt="English flag" class="flag-icon">
                        <span>English</span>
                    </div>
                </div>
            </div>

            <!-- Mobile Menu Toggle Button -->
            <button class="menu-toggle" [ngClass]="{'active': isMenuOpen}" aria-label="Menu" (click)="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </div>

    <!-- Overlay for mobile menu -->
    <div class="menu-overlay" [ngClass]="{'active': isMenuOpen}" (click)="closeMenu()"></div>
</header>
