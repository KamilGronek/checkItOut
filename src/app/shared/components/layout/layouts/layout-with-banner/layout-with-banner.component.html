<fuse-loading-bar></fuse-loading-bar>
<div class="flex flex-col sm:flex-row items-center md:items-start sm:justify-center md:justify-start flex-auto min-w-0 h-full">
    <div
        class="bg-gray-100 overflow-y-auto h-full max-h-screen md:flex justify-end w-full lg:w-1/2 py-8 px-4 sm:p-12 md:p-16 sm:rounded-2xl md:rounded-none sm:shadow md:shadow-none sm:bg-card relative">
        <div class="absolute top-5 right-5">
            <languages></languages>
        </div>
        <router-outlet *ngIf="true"></router-outlet>
    </div>
    <div
        class="relative lg:flex flex-auto items-center justify-center hidden w-1/2 h-full overflow-hidden bg-gray-800 dark:border-l">
        <!-- @formatter:on -->
        <!-- Content -->
        <div class="flex duration-1000 ease-in-out"
             [ngStyle]="{
                 'transform': 'translateX(-' + currentTranslate + '%)',
                 'transition': isTransitioning ? 'transform 1s ease-in-out' : 'none'
             }"
             (transitionend)="handleTransitionEnd()">
            <div *ngFor="let message of duplicatedMessages" class="flex-shrink-0 w-full flex justify-center">
                <div class="max-w-1/2 flex flex-col gap-4 items-center">
                    <h2 class="text-5xl text-center font-bold text-gray-100">
                        {{ message.title }}
                    </h2>
                    <p class="mt-4 text-lg text-center text-gray-400">
                        {{ message.text }}
                    </p>
                    <div class="flex items-center mt-8">
                        <div class="flex flex-0 items-center -space-x-1.5">
                            <img
                                class="flex-0 w-10 h-10 rounded-full ring-4 ring-offset-1 ring-gray-800 ring-offset-gray-800 object-cover"
                                src="assets/images/avatars/female-18.jpg">
                            <img
                                class="flex-0 w-10 h-10 rounded-full ring-4 ring-offset-1 ring-gray-800 ring-offset-gray-800 object-cover"
                                src="assets/images/avatars/female-11.jpg">
                            <img
                                class="flex-0 w-10 h-10 rounded-full ring-4 ring-offset-1 ring-gray-800 ring-offset-gray-800 object-cover"
                                src="assets/images/avatars/male-09.jpg">
                            <img
                                class="flex-0 w-10 h-10 rounded-full ring-4 ring-offset-1 ring-gray-800 ring-offset-gray-800 object-cover"
                                src="assets/images/avatars/male-16.jpg">
                        </div>
                        <div class="ml-4 font-medium tracking-tight text-gray-400">More than 17k people joined us, it's your
                            turn
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Background - @formatter:off -->
        <!-- Rings -->
        <svg class="absolute inset-0 pointer-events-none"
             viewBox="0 0 960 540" width="100%" height="100%" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
            <g class="text-gray-700 opacity-25" fill="none" stroke="currentColor" stroke-width="100">
                <circle r="234" cx="196" cy="23"></circle>
                <circle r="234" cx="790" cy="491"></circle>
            </g>
        </svg>
        <!-- Dots -->
        <svg class="absolute -top-16 -right-16 text-gray-700"
             viewBox="0 0 220 192" width="220" height="192" fill="none">
            <defs>
                <pattern id="837c3e70-6c3a-44e6-8854-cc48c737b659" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                    <rect x="0" y="0" width="4" height="4" fill="currentColor"></rect>
                </pattern>
            </defs>
            <rect width="220" height="192" fill="url(#837c3e70-6c3a-44e6-8854-cc48c737b659)"></rect>
        </svg>
    </div>
</div>
