<mat-form-field class="w-full" appearance="fill">
  <mat-label>{{ label }}</mat-label>
  <mat-select [formControl]="control" (selectionChange)="selectionChange.emit($event.value)">
    <mat-option *ngFor="let option of options" [value]="option.value">
      {{ option.label }} <span class="ml-2">{{ option.symbol }}</span>
    </mat-option>
  </mat-select>
</mat-form-field>
