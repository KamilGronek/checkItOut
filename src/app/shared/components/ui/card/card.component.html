<fuse-card
    [ngClass]="flippable || click.observers.length > 0 ? 'h-full grow cursor-pointer ' + customClass : 'h-full grow ' + customClass"
    [flippable]="true"
    (click)="handleCardClick($event)"
    (keydown.enter)="handleCardClick($event)"
    (keydown.space)="handleCardClick($event)"
    tabindex="0"
    [attr.aria-label]="'Flippable card' + (imgAlt ? ' with ' + imgAlt : '')">
    <!-- Front Side -->
    <ng-container fuseCardFront>
        <img
            *ngIf="imgSrc"
            [src]="imgSrc"
            class="max-h-40 object-cover"
            [alt]="imgAlt"
        />
        <div
            class="py-4 px-5 w-full h-full flex flex-col shadow-lg border">
            <!-- Header -->
            <div class="font-bold">
                <ng-content select="[card-header]"></ng-content>
            </div>

            <!-- Main Content -->
            <div class="text-xl">
                <ng-content></ng-content>
            </div>

            <!-- Footer -->
            <div class="mt-auto">
                <ng-content select="[card-footer]"></ng-content>
            </div>
        </div>
    </ng-container>

    <!-- Back Side - Conditionally Render (Hidden by Default) -->
    <ng-container fuseCardBack>
        <div class="py-4 px-5 w-full h-full shadow-lg border">
            <ng-content select="[card-back]"></ng-content>
        </div>
    </ng-container>
</fuse-card>
