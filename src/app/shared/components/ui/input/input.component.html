<ng-container [ngSwitch]="type">
  <!-- Checkbox -->
  <mat-checkbox
    *ngSwitchCase="'checkbox'"
    [id]="id"
    [formControl]="control"
    [ngClass]="'w-full ' + customClass"
  >
    <span class="flex">
      <ng-container *ngTemplateOutlet="inputLabel"></ng-container>
      <span *ngIf="isRequired()">*</span>
    </span>
  </mat-checkbox>

  <!-- Image Input (using specialized component) -->
  <app-image-input
    *ngSwitchCase="'image'"
    [control]="control"
    [rounded]="rounded"
    [multiple]="multiple"
    [acceptedFileTypes]="acceptedFileTypes"
    [maxFileSize]="maxFileSize"
    [storagePath]="storagePath"
    [storageRoot]="storageRoot"
    [hint]="hint"
    [customClass]="customClass"
    [id]="id"
    (imageUploaded)="onImageUploaded($event)"
    (uploadError)="onUploadError($event)"
  >
    <ng-container *ngTemplateOutlet="inputLabel"></ng-container>
  </app-image-input>

  <!-- File Input (using specialized component) -->
  <app-file-input
    *ngSwitchCase="'file'"
    [control]="control"
    [multiple]="multiple"
    [acceptedFileTypes]="acceptedFileTypes"
    [maxFileSize]="maxFileSize"
    [storagePath]="storagePath"
    [storageRoot]="storageRoot"
    [hint]="hint"
    [customClass]="customClass"
    [id]="id"
    (fileUploaded)="onFileUploaded($event)"
    (uploadError)="onUploadError($event)"
  >
    <ng-container *ngTemplateOutlet="inputLabel"></ng-container>
  </app-file-input>

  <!-- Single Date Picker -->
  <mat-form-field
    appearance="fill"
    [floatLabel]="'always'"
    *ngSwitchCase="'datepicker'"
    [ngClass]="'w-full ' + customClass"
  >
    <mat-label>
      <ng-container *ngTemplateOutlet="inputLabel"></ng-container>
    </mat-label>
    <input
      matInput
      [id]="id"
      [formControl]="control"
      [matDatepicker]="picker"
      [placeholder]="placeholder"
      [min]="minDate"
      [max]="maxDate"
      (dateChange)="handleDateChange($event)"
    />
    <mat-icon *ngIf="prefixIcon" matPrefix class="icon-size-5" [svgIcon]="prefixIcon"></mat-icon>
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
    <mat-hint *ngIf="hint">{{ hint }}</mat-hint>
    <mat-error *ngIf="control.invalid && control.touched">
      {{ getErrorMessage() }}
    </mat-error>
  </mat-form-field>

  <!-- Date Range Picker -->
  <mat-form-field
    appearance="fill"
    [floatLabel]="'always'"
    *ngSwitchCase="'daterange'"
    [ngClass]="'w-full ' + customClass"
  >
    <mat-label>
      <ng-container *ngTemplateOutlet="inputLabel"></ng-container>
    </mat-label>
    <mat-date-range-input [rangePicker]="rangePicker" [min]="minDate" [max]="maxDate">
      <input
        matStartDate
        [id]="id + '-start'"
        [placeholder]="'Start ' + placeholder"
        [formControl]="startControl"
        (dateChange)="handleDateRangeChange()"
      />
      <input
        matEndDate
        [id]="id + '-end'"
        [placeholder]="'End ' + placeholder"
        [formControl]="endControl"
        (dateChange)="handleDateRangeChange()"
      />
    </mat-date-range-input>
    <mat-icon *ngIf="prefixIcon" matPrefix class="icon-size-5" [svgIcon]="prefixIcon"></mat-icon>
    <mat-datepicker-toggle matIconSuffix [for]="rangePicker"></mat-datepicker-toggle>
    <mat-date-range-picker #rangePicker></mat-date-range-picker>
    <mat-hint *ngIf="hint">{{ hint }}</mat-hint>
    <mat-error *ngIf="startControl.invalid && startControl.touched">
      {{ getStartDateErrorMessage() }}
    </mat-error>
    <mat-error *ngIf="endControl.invalid && endControl.touched && !startControl.invalid">
      {{ getEndDateErrorMessage() }}
    </mat-error>
  </mat-form-field>

  <!--  Textarea  -->
  <mat-form-field
    appearance="fill"
    [floatLabel]="'always'"
    *ngSwitchCase="'textarea'"
    [ngClass]="'w-full ' + customClass"
  >
    <mat-label>
      <ng-container *ngTemplateOutlet="inputLabel"></ng-container>
    </mat-label>
    <textarea
      matInput
      [id]="id"
      [formControl]="control"
      [placeholder]="placeholder"
      [rows]="rows"
      [attr.maxlength]="maxLength"
      (input)="handleInput($event)"
      (keyup)="handleKeyup($event)"
    ></textarea>
    <mat-icon *ngIf="prefixIcon" matPrefix class="icon-size-5" [svgIcon]="prefixIcon"></mat-icon>
    <mat-hint align="end" *ngIf="maxLength">
      {{ control.value?.length || 0 }}/{{ maxLength }}
    </mat-hint>
    <mat-hint *ngIf="hint">{{ hint }}</mat-hint>
    <mat-error *ngIf="control.invalid && control.touched">
      {{ getErrorMessage() }}
    </mat-error>
  </mat-form-field>

  <!-- Regular Input (text, email, password, etc.) -->
  <mat-form-field
    appearance="fill"
    [floatLabel]="'always'"
    *ngSwitchDefault
    [ngClass]="'w-full ' + customClass"
  >
    <mat-label>
      <ng-container *ngTemplateOutlet="inputLabel"></ng-container>
    </mat-label>
    <input
      matInput
      [id]="id"
      [type]="inputType"
      [formControl]="control"
      [placeholder]="placeholder"
      (input)="handleInput($event)"
      (keyup)="handleKeyup($event)"
    />
    <mat-icon *ngIf="prefixIcon" matPrefix class="icon-size-5" [svgIcon]="prefixIcon"></mat-icon>
    <button
      *ngIf="type === 'password'"
      mat-icon-button
      type="button"
      (click)="togglePasswordVisibility()"
      matSuffix
    >
      <mat-icon
        class="icon-size-5"
        [svgIcon]="inputType === 'password' ? 'heroicons_solid:eye' : 'heroicons_solid:eye-slash'"
      >
      </mat-icon>
    </button>
    <mat-hint *ngIf="hint">{{ hint }}</mat-hint>
    <mat-error *ngIf="control.invalid && control.touched">
      {{ getErrorMessage() }}
    </mat-error>
  </mat-form-field>
</ng-container>

<ng-template #inputLabel>
  <ng-content></ng-content>
</ng-template>
