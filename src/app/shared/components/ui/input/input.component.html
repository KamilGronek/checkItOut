<ng-container [ngSwitch]="type" class="grow">
  <div class="relative grow">
    <!-- Checkbox -->
    <mat-checkbox
      *ngSwitchCase="'checkbox'"
      [id]="id"
      [formControl]="control"
      [ngClass]="'w-full ' + customClass"
    >
      <span class="flex">
        <ng-container *ngTemplateOutlet="inputLabel"></ng-container>
        <span *ngIf="isRequired()">*</span>
      </span>
    </mat-checkbox>

    <!-- Image Input -->
    <div *ngSwitchCase="'image'" [ngClass]="'w-full h-full ' + customClass">
      <div class="mb-2 font-medium">
        <ng-container *ngTemplateOutlet="inputLabel"></ng-container>
      </div>

      <!-- Hidden file input -->
      <input
        type="file"
        [id]="id"
        [accept]="acceptedFileTypes"
        (change)="onFileSelected($event)"
        class="hidden"
        #fileInput
        aria-label="Select an image file"
      />

      <!-- Image container with preview or placeholder -->
      <div class="relative w-fit">
        <!-- Placeholder when no image is selected -->
        <div
          *ngIf="!previewUrl && (!control.value || control.value.length === 0)"
          class="h-32 w-32 border-2 border-dashed border-gray-300 flex items-center justify-center cursor-pointer bg-gray-50"
          [ngClass]="{
            'rounded-full': rounded,
            'rounded-md': !rounded
          }"
          (click)="fileInput.click()"
        >
          <div class="text-center p-4">
            <mat-icon class="text-gray-400 text-3xl mb-2">photo_camera</mat-icon>
            <p class="text-sm text-gray-500">Click to select image</p>
          </div>
        </div>

        <!-- Preview image if available -->
        <div *ngIf="previewUrl || (control.value && control.value.length > 0)" class="relative">
          <div
            class="h-32 w-32 border overflow-hidden cursor-pointer"
            [ngClass]="{
              'rounded-full': rounded,
              'rounded-md': !rounded
            }"
            (click)="fileInput.click()"
          >
            <img
              [src]="previewUrl || control.value"
              class="w-full h-full object-cover"
              alt="Selected image"
            />
          </div>

          <!-- Remove button -->
          <button
            mat-mini-fab
            color="warn"
            type="button"
            [disabled]="isUploading || control.disabled"
            (click)="removeImage()"
            class="absolute top-0 right-0 -translate-y-1/3 translate-x-1/3 scale-75"
          >
            <mat-icon class="icon-size-5">delete</mat-icon>
          </button>
          <!-- Upload button -->
          <button
            *ngIf="selectedFile && !control.value.startsWith('http')"
            mat-mini-fab
            color="primary"
            type="button"
            [disabled]="isUploading || control.disabled"
            (click)="uploadImage()"
            class="absolute bottom-0 right-0 translate-y-1/3 translate-x-1/3 scale-75"
          >
            <mat-icon class="icon-size-5">upload</mat-icon>
          </button>
        </div>

        <!-- Loading overlay -->
        <div
          *ngIf="isUploading"
          class="absolute inset-0 bg-black bg-opacity-30 flex items-center justify-center rounded-md"
        >
          <mat-progress-spinner
            mode="indeterminate"
            diameter="40"
            color="accent"
          ></mat-progress-spinner>
        </div>
      </div>

      <!-- Hint Text -->
      <div *ngIf="hint" [id]="id + '-hint'" class="text-gray-600 text-sm mt-2">
        {{ hint }}
      </div>

      <!-- Error Handling -->
      <div *ngIf="control?.invalid && control?.touched" class="text-red-500 text-sm mt-1">
        {{ getErrorMessage() }}
      </div>
    </div>

    <!-- Single Date Picker -->
    <mat-form-field
      appearance="fill"
      [floatLabel]="'always'"
      *ngSwitchCase="'datepicker'"
      [ngClass]="'w-full ' + customClass"
    >
      <mat-label>
        <ng-container *ngTemplateOutlet="inputLabel"></ng-container>
      </mat-label>

      <input
        matInput
        [id]="id"
        [formControl]="control"
        [matDatepicker]="picker"
        [placeholder]="placeholder"
        [min]="minDate"
        [max]="maxDate"
        (dateChange)="handleDateChange($event)"
        [attr.aria-describedby]="hint ? id + '-hint' : null"
        [attr.aria-invalid]="control?.invalid"
      />

      <!-- Prefix Icon -->
      <mat-icon *ngIf="prefixIcon" matPrefix class="icon-size-5" [svgIcon]="prefixIcon"></mat-icon>

      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>

      <!-- Error Handling -->
      <mat-error *ngIf="control?.invalid && control?.touched">
        {{ getErrorMessage() }}
      </mat-error>
    </mat-form-field>

    <!-- Date Range Picker -->
    <mat-form-field
      appearance="fill"
      [floatLabel]="'always'"
      *ngSwitchCase="'daterange'"
      [ngClass]="'w-full ' + customClass"
    >
      <mat-label>
        <ng-container *ngTemplateOutlet="inputLabel"></ng-container>
      </mat-label>

      <mat-date-range-input
        [rangePicker]="rangePicker"
        [min]="minDate"
        [max]="maxDate"
        [attr.aria-describedby]="hint ? id + '-hint' : null"
      >
        <input
          matStartDate
          [id]="id + '-start'"
          [placeholder]="'Start ' + placeholder"
          [formControl]="startControl"
          (dateChange)="handleDateRangeChange()"
        />
        <input
          matEndDate
          [id]="id + '-end'"
          [placeholder]="'End ' + placeholder"
          [formControl]="endControl"
          (dateChange)="handleDateRangeChange()"
        />
      </mat-date-range-input>

      <!-- Prefix Icon -->
      <mat-icon *ngIf="prefixIcon" matPrefix class="icon-size-5" [svgIcon]="prefixIcon"></mat-icon>

      <mat-datepicker-toggle matIconSuffix [for]="rangePicker"></mat-datepicker-toggle>
      <mat-date-range-picker #rangePicker></mat-date-range-picker>

      <!-- Error Handling for Start Date -->
      <mat-error *ngIf="startControl?.invalid && startControl?.touched">
        {{ getStartDateErrorMessage() }}
      </mat-error>

      <!-- Error Handling for End Date - only show if start date is valid -->
      <mat-error *ngIf="endControl?.invalid && endControl?.touched && !startControl?.invalid">
        {{ getEndDateErrorMessage() }}
      </mat-error>
    </mat-form-field>

    <!--  Textarea  -->
    <mat-form-field
      appearance="fill"
      [floatLabel]="'always'"
      *ngSwitchCase="'textarea'"
      [ngClass]="'w-full ' + customClass"
    >
      <mat-label>
        <ng-container *ngTemplateOutlet="inputLabel"></ng-container>
      </mat-label>

      <textarea
        matInput
        [id]="id"
        [ngClass]="'w-full ' + customClass"
        [formControl]="control"
        [placeholder]="placeholder"
        [rows]="rows"
        [attr.maxlength]="maxLength"
        (input)="handleInput($event)"
        (keyup)="handleKeyup($event)"
        [attr.aria-describedby]="hint ? id + '-hint' : null"
        [attr.aria-invalid]="control?.invalid"
      ></textarea>

      <!-- Prefix Icon -->
      <mat-icon *ngIf="prefixIcon" matPrefix class="icon-size-5" [svgIcon]="prefixIcon"></mat-icon>

      <!-- Error Handling -->
      <mat-error *ngIf="control?.invalid && control?.touched">
        {{ getErrorMessage() }}
      </mat-error>
    </mat-form-field>

    <!-- Regular Input (text, email, password, etc.) -->
    <mat-form-field
      appearance="fill"
      [floatLabel]="'always'"
      *ngSwitchDefault
      [ngClass]="'w-full ' + customClass"
    >
      <mat-label>
        <ng-container *ngTemplateOutlet="inputLabel"></ng-container>
      </mat-label>

      <input
        matInput
        [id]="id"
        [ngClass]="'w-full ' + customClass"
        [type]="inputType"
        [formControl]="control"
        [placeholder]="placeholder"
        (input)="handleInput($event)"
        (keyup)="handleKeyup($event)"
        [attr.aria-describedby]="hint ? id + '-hint' : null"
        [attr.aria-invalid]="control?.invalid"
      />

      <!-- Prefix Icon -->
      <mat-icon *ngIf="prefixIcon" matPrefix class="icon-size-5" [svgIcon]="prefixIcon"></mat-icon>

      <!-- Password Toggle Button -->
      <button
        *ngIf="type === 'password'"
        mat-icon-button
        type="button"
        (click)="togglePasswordVisibility()"
        matSuffix
      >
        <mat-icon
          class="icon-size-5"
          [svgIcon]="inputType === 'password' ? 'heroicons_solid:eye' : 'heroicons_solid:eye-slash'"
        >
        </mat-icon>
      </button>

      <!-- Error Handling -->
      <mat-error *ngIf="control?.invalid && control?.touched">
        {{ getErrorMessage() }}
      </mat-error>
    </mat-form-field>

    <mat-icon
      *ngIf="hint"
      class="absolute right-0 top-0 icon-size-4"
      [matTooltip]="hint"
      [matTooltipDisabled]="hint == false"
      [matTooltipShowDelay]="50"
      [matTooltipHideDelay]="50"
      svgIcon="feather:help-circle"
    ></mat-icon>
  </div>
</ng-container>

<!-- Shared template for button content -->
<ng-template #inputLabel>
  <ng-content></ng-content>
</ng-template>
