<div class="w-full overflow-x-scroll">
    <div class="flex items-center justify-between gap-4 p-4">
        <h2 class="text-xl font-medium tracking-tight leading-6 truncate">{{ title }}</h2>
        <form [formGroup]="headerForm">
            <app-input label="Search" [control]="headerForm.controls.filter" (keyup)="applyFilter($event)" placeholder="Type to filter"/>
        </form>
    </div>

    <table
        mat-table
        multiTemplateDataRows
        matSort
        [dataSource]="data"
        class="w-full overflow-x-scroll">
        @for (column of columnsToDisplay; track column) {
            <ng-container [matColumnDef]="column.key">
                <th mat-header-cell mat-sort-header *matHeaderCellDef>
                    <span>
                        {{column.label | transloco}}
                    </span>
                </th>
                <td mat-cell *matCellDef="let element">{{element[column.key]}}</td>
            </ng-container>
        }
        <ng-container matColumnDef="expand">
            <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
            <td mat-cell *matCellDef="let element">
                <button
                    mat-icon-button
                    aria-label="expand row"
                    (click)="toggle(element); $event.stopPropagation()"
                    class="toggle-button"
                    [class.toggle-button-expanded]="isExpanded(element)">
                    <mat-icon>keyboard_arrow_down</mat-icon>
                </button>
            </td>
        </ng-container>

        <ng-container matColumnDef="expandedDetail">
            <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplayWithExpand.length">
                <div class="element-detail-wrapper"
                     [class.element-detail-wrapper-expanded]="isExpanded(element)">
                    <div class="element-detail">
                        <ng-container *ngTemplateOutlet="expandableTemplate; context: { $implicit: element }"></ng-container>
                    </div>
                </div>
            </td>
        </ng-container>


        <tr mat-header-row *matHeaderRowDef="columnsToDisplayWithExpand"></tr>
        <tr mat-row *matRowDef="let element; columns: columnsToDisplayWithExpand;"
            class="element-row"
            [class.expanded-row]="isExpanded(element)"
            (click)="toggle(element)">
        </tr>
        <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="detail-row"></tr>
    </table>
</div>

<div class="block sm:hidden p-4">
  <div *ngFor="let row of data" class="bg-card rounded-xl shadow p-4 mb-4 border border-gray-200">
    <div *ngFor="let column of columnsToDisplay" class="mb-2">
      <div class="text-gray-500 text-sm font-medium">
        {{ column.label | transloco }}
      </div>
      <div class="text-black font-semibold">
        {{ row[column.key] }}
      </div>
    </div>

    <!-- Możesz dodać przycisk edycji/rozwinięcia -->
    <button
      mat-button
      class="mt-2 text-primary underline"
      (click)="toggle(row)">
      {{ 'admin.new_influencers.details.show_more' | transloco }}
    </button>

    <div *ngIf="isExpanded(row)">
      <ng-container *ngTemplateOutlet="expandableTemplate; context: { $implicit: row }"></ng-container>
    </div>
  </div>
</div>
