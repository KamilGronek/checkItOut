<div class="snackbar-content" [ngClass]="data.type">
    <ng-container *ngIf="data.type === 'success'">
        <mat-icon class="first-icon">check_circle</mat-icon>
    </ng-container>
    <ng-container *ngIf="data.type === 'failure'">
        <mat-icon class="first-icon">error</mat-icon>
    </ng-container>

    <div class="message">{{ data.message }}</div>
    <button class="close" (click)="data.dismiss()">
        <mat-icon>close</mat-icon>
    </button>
</div>
