<div class="bg-card flex min-w-0 flex-auto flex-col dark:bg-transparent sm:inset-0 sm:overflow-hidden"
>
      <div class="flex flex-0 flex-col border-b px-6 py-8 sm:flex-row sm:items-center md:px-8 justify-between">
        <div class="lg:text-4xl font-extrabold tracking-tight sm:text-3xl">
          Współprace do podjęcia
        </div>
        <form class="mr-4 px-6 flex lg:flex-row sm:flex-col gap-4 sm:w-[300px] lg:w-[600px]">
            <mat-form-field class="w-full ">
                <mat-label>Kolumna:</mat-label>
                <mat-select [value]="selectedFilter" (selectionChange)="onSearchSelectChange($event)">
                    <mat-option *ngFor="let field of fieldOptions" [value]="field">
                        {{ field }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field class="w-full">
                <mat-label>Wartość:</mat-label>

                <input matInput 
                    [(value)]="searchValue" #textItem
                    (input)="onSearchInputChange(textItem.value)" 
                />
            </mat-form-field>
        </form>  
        <button 
          class="px-3"
          mat-button
          [color]="'primary'"
          (click)="addCollaboration()">
          Dodaj współpracę
        </button>
      </div>
    <div class="flex-auto p-6 sm:p-10">
      <div class="-m-4 flex w-full max-w-400 flex-wrap items-start">
        <fuse-card 
        style="margin: 16px;"
        *ngFor="let item of collaborationList" class="filter-article filter-interactive flex w-full max-w-80 flex-col"
                [flippable]="true"
                [face]="'front'"
                #flippableCard01="fuseCard"
            >
                <ng-container fuseCardFront >

                  <!-- *ngIf="item.company.imageUrl" -->
                    <img 
                      [src]="item.company.imageUrl"
                        class="object-cover"
                        alt="Card cover image"
                    />
                    <div class="m-8 mb-4">
                        <div class="text-2xl font-semibold leading-tight">
                          {{ item.name }}
                        </div>
                        <a class="whitespace-nowrap text-primary-500">
                          {{ item.city }}
                        </a>
                        <div class="mt-4">
                            {{item.title}}
                        </div>
                        <div class="mt-4">
                          {{item.details}}
                      </div>
                        
                        <div class="-mx-3 mt-3">
                          <button 
                          class="px-3"
                          mat-button
                          [color]="'primary'"
                          (click)="goToDetails(item.id)">
                            Szczegóły współpracy
                          </button>
                        </div>
                    </div>
                </ng-container>
        </fuse-card>
      </div>
    </div>
    <div class="flex mb-10">
        <mat-paginator class="demo-paginator" (page)="handlePageEvent($event)" [length]="length"
            [pageSize]="pageSize" [disabled]="disabled" [showFirstLastButtons]="showFirstLastButtons"
            [pageSizeOptions]="
                showPageSizeOptions ? pageSizeOptions : []
            " [hidePageSize]="hidePageSize" [pageIndex]="pageIndex" aria-label="Wybierz strone">
        </mat-paginator>
        <label class="pageNr">Strona nr: {{ pageIndex }}</label>
    </div>
</div>
