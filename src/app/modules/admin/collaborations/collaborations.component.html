<div class="bg-card flex min-w-0 flex-auto flex-col dark:bg-transparent sm:inset-0 sm:overflow-hidden"
>
      <div class="flex flex-0 flex-col border-b px-6 py-8 sm:flex-row sm:items-center md:px-8 justify-between">
        <div class="text-4xl font-extrabold tracking-tight">Współprace do podjęcia</div>
        <button 
        class="px-3"
        mat-button
        [color]="'primary'"
        (click)="addCollaboration()">
          Dodaj współpracę
        </button>
      </div>
    <div class="flex-auto p-6 sm:p-10">
      <div class="-m-4 flex w-full max-w-400 flex-wrap items-start">
        <fuse-card 
        style="margin: 16px;"
        *ngFor="let item of influencerList" class="filter-article filter-interactive flex w-full max-w-80 flex-col"
                [flippable]="true"
                [face]="'front'"
                #flippableCard01="fuseCard"
            >
                <ng-container fuseCardFront>
                    <img  [src]="item.images"
                        class="object-cover"
                        alt="Card cover image"
                    />
                    <div class="m-8 mb-4">
                        <div class="text-2xl font-semibold leading-tight">
                          {{ item.firstName }}
                        </div>
                        <a class="whitespace-nowrap text-primary-500">
                          {{ item.instagramId }}
                        </a>
                        <div class="mt-4">
                            From rocky mountains to crystal clear lakes, there
                            are the places you must see and enjoy.
                        </div>
                        <div class="-mx-3 mt-3">
                          <button 
                          class="px-3"
                          mat-button
                          [color]="'primary'"
                          (click)="goToDetails(item.id)">
                            Szczegóły współpracy
                          </button>
