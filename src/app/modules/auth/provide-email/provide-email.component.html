<mat-card
    appearance="outlined"
    class="flex flex-col p-6 w-96 mx-auto shadow-lg bg-gray-900 text-white rounded-lg"
>
    <!-- Title -->
    <div class="text-xl font-bold text-center">Email Required</div>
    <p class="text-gray-400 text-center mt-1">
        Please enter your email to continue.
    </p>

    <!-- Email Input -->
    <mat-form-field appearance="outline" class="w-full mt-4">
        <mat-label class="text-white">Email</mat-label>
        <input
            class="text-white"
            matInput
            type="email"
            [(ngModel)]="email"
            required
        />
    </mat-form-field>

    <!-- Actions -->
    <div class="flex justify-end gap-3 mt-4">
        <button
            mat-button
            (click)="cancel()"
            class="text-gray-400 hover:text-white"
        >
            Cancel
        </button>
        <button
            mat-flat-button
            color="primary"
            (click)="submitEmail()"
            [disabled]="!email"
            class="bg-blue-600 text-white px-4 py-2 rounded"
        >
            Continue
        </button>
    </div>
</mat-card>
