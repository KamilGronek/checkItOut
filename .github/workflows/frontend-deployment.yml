name: Frontend CI/CD

on:
    push:
        branches: ["feature/ci-cd"]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build Docker Image
              run: |
                  docker build --cache-from ${{ secrets.DOCKER_USERNAME }}/frontend:latest \
                      -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest .

            - name: Push Docker Image
              run: docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest

            - name: Deploy to OVH
              env:
                  HOST: ${{ secrets.OVH_HOST }}
                  USERNAME: ${{ secrets.OVH_USERNAME }}
                  PASSWORD: ${{ secrets.OVH_PASSWORD }}
              run: |
                  sshpass -p "$PASSWORD" ssh -o StrictHostKeyChecking=no "$USERNAME@$HOST" "
                  sudo docker-compose pull frontend &&
                  sudo docker-compose up -d frontend &&
                  sudo docker image prune -f"
