name: Cors problem

on: workflow_dispatch

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to OVH
              env:
                  HOST: ${{ secrets.OVH_HOST }}
                  USERNAME: ${{ secrets.OVH_USERNAME }}
                  PASSWORD: ${{ secrets.OVH_PASSWORD }}
              run: |
                  sshpass -p "$PASSWORD" ssh -o StrictHostKeyChecking=no "$USERNAME@$HOST" "
                  sudo ls &&
                  sudo pwd
